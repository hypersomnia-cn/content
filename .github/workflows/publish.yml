name: Validate content and notify website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: content-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    uses: hypersomnia-cn/hypersomnia-cn.github.io/.github/workflows/check-content.yml@main
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website build
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Set WEBSITE_DISPATCH_TOKEN to a token with Actions: write access to hypersomnia-cn/hypersomnia-cn.github.io.'
            exit 1
          fi
          gh workflow run publish.yml --repo hypersomnia-cn/hypersomnia-cn.github.io --ref main
